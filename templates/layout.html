<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <title>Assistente de consultores</title>
    </head>
    <body>
        <nav class="navbar navbar-expand bg-body-tertiary mb-4">
            <div class="container">
                <a class="navbar-brand" href="/">Assistente de consultores</a>
                <div class="navbar-nav">
                    <a class="nav-link" href="/">Produtos</a>
                    <a class="nav-link" href="/order">Carrinho ({{ session.get("order", {}).values() | sum }})</a>
                </div>
                  <form action="/currency" method="post">
                    <div class="btn-group btn-group-sm" role="group" aria-label="Currency selection">
                      <button class="btn btn-outline-secondary {% if session.get("currency", "BRL") == "BRL" %}active{% endif %}" type="submit" name="currency" value="BRL">BRL</button>
                      <button class="btn btn-outline-secondary {% if session.get("currency", "BRL") == "PYG" %}active{% endif %}" type="submit" name="currency" value="PYG">PYG</button>
                    </div>
                  </form>
            </div>
        </nav>
        <div class="container">
        {% block content %}{% endblock %}
        </div>
    </body>
</html>
