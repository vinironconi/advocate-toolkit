<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente de consultores</title>
</head>
<body>
    <h1>Assistente de consultores</h1>
    <p>Bem-vindos ao Assistente de consultores!</p>
    <nav>
        <a href="/">Produtos</a> |
        <a href="/order">Carrinho ({{session.get("order", {}).values() | sum}})</a>
    </nav>
      <form action="/currency" method="post">
        <label for="currency">Escolha a moeda:</label>
        <select name="currency" id="currency">
            <option value="BRL" {% if session.get("currency") == "BRL" %}selected{% endif %}>Real (BRL)</option>
            <option value="PYG" {% if session.get("currency") == "PYG" %}selected{% endif %}>Guarani (PYG)</option>
        </select>
        <button type="submit">Alterar moeda</button>
    </form>
  {% block content %}{% endblock %}

</body>
</html>
